<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Chat with Ollama</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link href="resources/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <script src="resources/bootstrap.bundle.min.js"
        integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm"
        crossorigin="anonymous"></script>
    <script src="resources/marked.min.js"
        integrity="sha384-dZulhREgb+hCgQMhZ2VG0l37VQj5pJBq2w0h7Jn3tdMn36aXNepF1+FMLBB4O649"
        crossorigin="anonymous"></script>
    <script src="resources/purify.min.js" integrity="sha256-QigBQMy2be3IqJD2ezKJUJ5gycSmyYlRHj2VGBuITpU="
        crossorigin="anonymous"></script>
    <script src="resources/jquery-3.7.1.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="chat.css">
</head>

<body data-bs-theme="dark">
    <div class="container">
            <div id="scroll-wrapper">
                <div id="chat-container" class="card">
                    <div class="card-body">
                        <div id="chat-history"></div>
                    </div>
            </div>
                        </div>
                    </div>

        <div class="position-fixed w-100" style="z-index: 9999; top: 0px; height: 200px; background: linear-gradient(180deg, black, transparent);">

          <div class="position-fixed w-100" style="z-index: 9999; top: 0px; height: 200px;  background: linear-gradient(180deg, black, transparent);">
            <div class="d-flex justify-content-between align-items-center m-0" style="padding: 16px;">
                <div class="d-flex align-items-center">
                  <h1 class="mb-0">Chat with Ollama</h1>
                  <button class="btn btn-sm btn-outline-secondary ms-3" type="button" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Settings" aria-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
                      <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
                      <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.902 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.892 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.892-1.64-.902-3.434-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
                    </svg>
                  </button>
                </div>
                <!-- Model dropdown -->
                <div class="d-flex align-items-center m-1">
                  <div class="p-2 flex-grow-1 bd-highlight">
                    <label for="system-prompt" class="me-2" style="font-size: normal;">System Prompt</label>
                    <input id="system-prompt" class="form-control" type="text" placeholder="You are a helpful assistant" style="width: auto;"></select>
                    <label for="host-address" class="me-2" style="font-size: normal;">Hostname</label>
                    <input id="host-address" class="form-control" type="text" placeholder="http://localhost:11434" style="width: auto;"></select>

                  </div>
                <div class="d-flex align-items-center m-2">
                    <div class="p-2 flex-grow-1 bd-highlight">
                        <label for="model-select" class="me-2" style="font-size: normal;">Model:</label>
                        <select class="form-select me-5" id="model-select" style="width: auto;"></select>
                        <label for="chat-select" class="me-2" style="font-size: normal;">History:</label>
                        <select id="chat-select" class="form-select me-2" style="width: auto;">
                            <option value="" disabled selected>Select a chat</option>
                        </select>
                    </div>
                    <div class="p-auto flex-grow-1 bd-highlight">
                        <div class="d-flex flex-column">
                        <button id="new-chat" class="btn btn-dark mb-2" type="button">Reset</button>
                        <button id="save-chat" class="btn btn-secondary mb-2" type="button" data-bs-toggle="modal" data-bs-target="#nameModal">Save</button>
                        <button id="delete-chat" class="btn btn-danger" type="button">Delete</button>
                      </div>
                    </div>
                </div>
            </div>
        </div>




    <div class="container p-2 card" id="input-area">
        <div id="file-attachment-area" style="display: none;">
            <div class="d-flex flex-wrap align-items-center" id="file-previews">
                <!-- File previews will be added here dynamically -->
            </div>
        </div>
        <div class="input-group">
            <textarea class="form-control" id="user-input" placeholder="Type your question here..." oninput="autoGrow(this)"></textarea>
            <button id="file-attach-button" class="btn btn-outline-secondary" type="button" title="Attach files">📎</button>
            <button id="send-button" class="btn btn-primary">Send</button>
        </div>
        <input type="file" id="file-input" multiple style="display: none;">
    </div>

<!-- Modal -->
<div class="modal fade" id="nameModal" tabindex="-1" aria-labelledby="nameModalLabel" aria-hidden="true" >
    <div class="modal-dialog" >
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="nameModalLabel">Enter Your Name</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="text" class="form-control" id="userName" placeholder="Your Name">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveName">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="settingsModalLabel">Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="credentials-mode" class="form-label">Credentials</label>
            <select id="credentials-mode" class="form-select">
              <option value="omit">omit</option>
              <option value="same-origin">same-origin</option>
              <option value="include">include</option>
            </select>
            <div class="form-text">
              Whether cookies are sent with requests to Ollama. Use <code>include</code> when Ollama is behind an authenticating reverse proxy.
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-settings" data-bs-dismiss="modal">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="errorModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Unable to access Ollama server</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="errorText"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="chat.js"></script>

</body>

</html>
